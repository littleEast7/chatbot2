name: Build Ubuntu app
on:
  workflow_dispatch:
  push:
    paths:
      - 'deskbuddy/app/**'
      - 'deskbuddy/assets/**'
      - 'deskbuddy/main.py'
      - 'deskbuddy/DeskBuddy.spec'
      - 'deskbuddy/requirements*.txt'
      - 'deskbuddy/scripts/build_ubuntu.sh'
      - 'deskbuddy/scripts/package_ubuntu.py'
      - 'deskbuddy/scripts/verify_ubuntu.sh'
      - 'deskbuddy/scripts/smoke.py'
      - 'deskbuddy/tests/**'
      - '.github/workflows/ubuntu-build.yml'
  pull_request:
    paths:
      - 'deskbuddy/**'
      - '.github/workflows/ubuntu-build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt build host libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0
      - name: Test, freeze and package
        run: bash deskbuddy/scripts/build_ubuntu.sh
      - name: Verify installed package in clean Ubuntu with no system Python
        run: |
          docker run --rm \
            -v "$PWD/.artifacts/ubuntu/${{ matrix.architecture }}:/artifacts:ro" \
            -v "$PWD/deskbuddy/scripts/verify_ubuntu.sh:/verify.sh:ro" \
            ubuntu:24.04 bash /verify.sh /artifacts/deskbuddy_0.2.0_${{ matrix.architecture }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBuddy-Ubuntu-24.04-${{ matrix.architecture }}
          path: |
            .artifacts/ubuntu/${{ matrix.architecture }}/*.deb
            .artifacts/ubuntu/${{ matrix.architecture }}/*.tar.gz
            .artifacts/ubuntu/${{ matrix.architecture }}/README-Ubuntu.txt
          if-no-files-found: error
